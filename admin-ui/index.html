<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 字体已自托管，由 src/index.css 导入并打进 dist/assets/，不再外连 Google Fonts。 -->
    <title>coban · Codex 代理</title>
    <script>
      // React 挂载前先还原已保存的语言，避免英文用户首帧读到中文标题与 lang。
      (() => {
        try {
          const language = localStorage.getItem('coban.language')
          if (language !== 'en' && language !== 'en-US') return
          document.documentElement.lang = 'en'
          document.title = 'coban · Codex Proxy'
        } catch {
          // localStorage 不可用时沿用 HTML 中的中文默认值。
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
