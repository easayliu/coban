<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 字体已自托管，由 src/index.css 导入并打进 dist/assets/，不再外连 Google Fonts。 -->
    <title>coban · 界面预览</title>
    <script>
      // 预览页的语言由 URL 固定，React 挂载前即可让 metadata 与 ?lang 保持一致。
      (() => {
        const language = new URLSearchParams(window.location.search).get('lang')
        if (language !== 'en' && language !== 'en-US') return
        document.documentElement.lang = 'en'
        document.title = 'coban · UI Preview'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
